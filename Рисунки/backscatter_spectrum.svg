<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f5ebf8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#7b2d8b" stroke-width="2"/></pattern>
    <style>
      .t{font-size:13px} .s{font-size:12px} .c{text-anchor:middle}
      .ax{stroke:#000;stroke-width:1.4;fill:none}
      .dim{stroke:#333;stroke-width:1;fill:none}
      .i{font-style:italic}
    </style>
  </defs>
  <rect width="960" height="520" fill="#fff"/>

  <!-- axes -->
  <line class="ax" x1="80" y1="410" x2="930" y2="410" marker-end="url(#a)"/>
  <polyline class="ax" points="80,410 80,196"/>
  <polyline class="ax" points="80,176 80,40" marker-end="url(#a)"/>
  <!-- axis break -->
  <line class="ax" x1="72" y1="200" x2="88" y2="192"/><line class="ax" x1="72" y1="180" x2="88" y2="172"/>
  <text x="88" y="34" class="t">Мощность, дБ</text>
  <text x="930" y="454" class="t" text-anchor="end">Частота</text>

  <!-- noise floor -->
  <line x1="80" y1="396" x2="910" y2="396" stroke="#999" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="795" y="390" class="s c" fill="#666">шумы приёмника</text>

  <!-- subchannel filter -->
  <rect x="540" y="232" width="60" height="178" fill="none" stroke="#1f5fae" stroke-width="1.6" stroke-dasharray="6 3"/>
  <text x="606" y="226" class="s" fill="#1f5fae">полоса фильтра подканала</text>

  <!-- carrier (with break) -->
  <rect x="487" y="196" width="16" height="214" fill="url(#h)" stroke="#7b2d8b" stroke-width="1.4"/>
  <rect x="487" y="70" width="16" height="106" fill="url(#h)" stroke="#7b2d8b" stroke-width="1.4"/>
  <line x1="479" y1="200" x2="511" y2="192" stroke="#fff" stroke-width="7"/>
  <line x1="479" y1="180" x2="511" y2="172" stroke="#fff" stroke-width="7"/>
  <line class="ax" x1="479" y1="200" x2="511" y2="192"/><line class="ax" x1="479" y1="180" x2="511" y2="172"/>

  <!-- sidebands f_c ± f_s -->
  <rect x="412" y="250" width="16" height="160" fill="#d9480f" stroke="#a83a0c" stroke-width="1.2"/>
  <rect x="562" y="250" width="16" height="160" fill="#d9480f" stroke="#a83a0c" stroke-width="1.2"/>
  <!-- 3rd harmonics -->
  <rect x="262" y="307" width="16" height="103" fill="#f59f00" stroke="#b87800" stroke-width="1.2"/>
  <rect x="712" y="307" width="16" height="103" fill="#f59f00" stroke="#b87800" stroke-width="1.2"/>
  <!-- 5th harmonics -->
  <rect x="112" y="334" width="16" height="76" fill="#ffe066" stroke="#c9a400" stroke-width="1.2"/>
  <rect x="862" y="334" width="16" height="76" fill="#ffe066" stroke="#c9a400" stroke-width="1.2"/>

  <!-- level guides -->
  <line x1="428" y1="250" x2="562" y2="250" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="578" y1="250" x2="760" y2="250" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="728" y1="307" x2="760" y2="307" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="340" y1="70" x2="487" y2="70" stroke="#999" stroke-dasharray="3 3"/><line x1="340" y1="250" x2="412" y2="250" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="878" y1="334" x2="900" y2="334" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="760" y1="250" x2="900" y2="250" stroke="#999" stroke-dasharray="3 3"/>

  <!-- dimensions -->
  <line class="dim" x1="350" y1="72" x2="350" y2="248" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="342" y="140" class="s" text-anchor="end" fill="#7b2d8b">≈ 70 дБ и более</text>
  <text x="342" y="156" class="s" text-anchor="end" fill="#7b2d8b">(утечка CW,</text>
  <text x="342" y="172" class="s" text-anchor="end" fill="#7b2d8b">см. пример расчёта)</text>
  <line class="dim" x1="750" y1="252" x2="750" y2="305" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="756" y="284" class="s" fill="#b87800">−9,5 дБ</text>
  <line class="dim" x1="895" y1="252" x2="895" y2="332" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="889" y="296" class="s" text-anchor="end" fill="#a68800">−14 дБ</text>

  <!-- labels on bars -->
  <text x="495" y="60" class="s c" fill="#7b2d8b">несущая (утечка CW)</text>
  <text x="420" y="242" class="s c" fill="#d9480f">D2R</text>
  <text x="570" y="242" class="s c" fill="#d9480f">D2R</text>

  <!-- x ticks -->
  
  <line class="ax" x1="120" y1="410" x2="120" y2="416"/><text x="99.8" y="432" font-size="12" font-style="italic"><tspan>f</tspan><tspan font-size="9" dy="3">c</tspan><tspan dy="-3"></tspan><tspan> − 5f</tspan><tspan font-size="9" dy="3">s</tspan><tspan dy="-3"></tspan></text><line class="ax" x1="270" y1="410" x2="270" y2="416"/><text x="249.8" y="432" font-size="12" font-style="italic"><tspan>f</tspan><tspan font-size="9" dy="3">c</tspan><tspan dy="-3"></tspan><tspan> − 3f</tspan><tspan font-size="9" dy="3">s</tspan><tspan dy="-3"></tspan></text><line class="ax" x1="420" y1="410" x2="420" y2="416"/><text x="403.4" y="432" font-size="12" font-style="italic"><tspan>f</tspan><tspan font-size="9" dy="3">c</tspan><tspan dy="-3"></tspan><tspan> − f</tspan><tspan font-size="9" dy="3">s</tspan><tspan dy="-3"></tspan></text><line class="ax" x1="495" y1="410" x2="495" y2="416"/><text x="490.7" y="432" font-size="12" font-style="italic"><tspan>f</tspan><tspan font-size="9" dy="3">c</tspan><tspan dy="-3"></tspan></text><line class="ax" x1="570" y1="410" x2="570" y2="416"/><text x="553.4" y="432" font-size="12" font-style="italic"><tspan>f</tspan><tspan font-size="9" dy="3">c</tspan><tspan dy="-3"></tspan><tspan> + f</tspan><tspan font-size="9" dy="3">s</tspan><tspan dy="-3"></tspan></text><line class="ax" x1="720" y1="410" x2="720" y2="416"/><text x="699.8" y="432" font-size="12" font-style="italic"><tspan>f</tspan><tspan font-size="9" dy="3">c</tspan><tspan dy="-3"></tspan><tspan> + 3f</tspan><tspan font-size="9" dy="3">s</tspan><tspan dy="-3"></tspan></text><line class="ax" x1="870" y1="410" x2="870" y2="416"/><text x="849.8" y="432" font-size="12" font-style="italic"><tspan>f</tspan><tspan font-size="9" dy="3">c</tspan><tspan dy="-3"></tspan><tspan> + 5f</tspan><tspan font-size="9" dy="3">s</tspan><tspan dy="-3"></tspan></text>
  <!-- f_s spacing -->
  <line class="dim" x1="495" y1="448" x2="570" y2="448" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="527.9" y="464" font-size="12" font-style="italic"><tspan>f</tspan><tspan font-size="9" dy="3">s</tspan><tspan dy="-3"></tspan></text>

  <!-- legend -->
  <rect x="110" y="478" width="0" height="0"/>
  <g class="s">
    <rect x="110" y="458" width="14" height="12" fill="url(#h)" stroke="#7b2d8b"/><text x="130" y="469">несущая</text>
    <rect x="200" y="458" width="14" height="12" fill="#d9480f" stroke="#a83a0c"/><text x="220" y="469">полезный сигнал (1-я гармоника)</text>
    <rect x="560" y="458" width="14" height="12" fill="#f59f00" stroke="#b87800"/><text x="580" y="469">3-я гармоника</text>
    <rect x="680" y="458" width="14" height="12" fill="#ffe066" stroke="#c9a400"/><text x="700" y="469">5-я гармоника (помехи соседям)</text>
  </g>

  <text x="480" y="504" font-size="14" font-weight="bold" text-anchor="middle">Рисунок 3: Спектр на входе приёмника считывателя при малом сдвиге частоты</text>
</svg>
