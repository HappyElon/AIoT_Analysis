<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="mcw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b2d8b"/></marker>
    <marker id="mrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fae"/></marker>
    <marker id="mtx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
    <marker id="men" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="mlk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07cc0"/></marker>
    <marker id="mdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <style>
      .b{fill:#fff;stroke:#222;stroke-width:1.3}
      .bg{fill:#f4f4f4;stroke:#222;stroke-width:1.3}
      .en{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
      .rx{fill:#e7f0fb;stroke:#1f5fae;stroke-width:1.5}
      .tx{fill:#fff0e6;stroke:#d9480f;stroke-width:1.5}
      .cwb{fill:#f5ebf8;stroke:#7b2d8b;stroke-width:1.5}
      .dev{fill:#f2f2f2;stroke:#2f4a7a;stroke-width:1.6}
      .t{font-size:13px;text-anchor:middle;fill:#111}
      .s{font-size:11.5px;text-anchor:middle;fill:#111}
      .l{stroke:#222;stroke-width:1.3;fill:none}
      .lcw{stroke:#7b2d8b;stroke-width:1.8;fill:none}
      .lrx{stroke:#1f5fae;stroke-width:1.6;fill:none}
      .ltx{stroke:#d9480f;stroke-width:1.8;fill:none}
      .ltxd{stroke:#d9480f;stroke-width:1.8;fill:none;stroke-dasharray:7 4}
      .len{stroke:#2e7d32;stroke-width:1.5;fill:none;stroke-dasharray:5 3}
      .llk{stroke:#b07cc0;stroke-width:1.4;fill:none;stroke-dasharray:3 3}
      .i{font-style:italic}
    </style>
  </defs>

  <rect width="960" height="520" fill="#fff"/>
  <text x="240" y="28" font-size="14" font-weight="bold" text-anchor="middle">а) Ближняя зона: индуктивная связь</text>
  <text x="240" y="46" class="s">LF / HF RFID, NFC; r много меньше λ / 2π</text>
  <!-- field lines -->
  <g fill="none" stroke="#1f5fae" stroke-width="1.4" stroke-dasharray="5 3" opacity="0.9">
    <ellipse cx="240" cy="200" rx="150" ry="40"/>
    <ellipse cx="240" cy="200" rx="165" ry="75"/>
    <ellipse cx="240" cy="200" rx="180" ry="110"/>
  </g>
  <text x="240" y="84" class="s" style="fill:#1f5fae">магнитное поле H ~ 1/r³</text>
  <!-- reader coil -->
  <ellipse cx="95" cy="200" rx="7" ry="50" fill="none" stroke="#7b2d8b" stroke-width="2"/><ellipse cx="102" cy="200" rx="7" ry="50" fill="none" stroke="#7b2d8b" stroke-width="2"/><ellipse cx="109" cy="200" rx="7" ry="50" fill="none" stroke="#7b2d8b" stroke-width="2"/><ellipse cx="116" cy="200" rx="7" ry="50" fill="none" stroke="#7b2d8b" stroke-width="2"/>
  <rect class="cwb" x="20" y="170" width="55" height="60"/><text x="47" y="196" class="s">Считы-</text><text x="47" y="210" class="s">ватель</text>
  <line class="lcw" x1="75" y1="190" x2="95" y2="190"/><line class="lcw" x1="75" y1="210" x2="95" y2="210"/>
  <text x="47" y="248" class="s" style="fill:#7b2d8b">L₁, ток I₁</text>
  <!-- tag coil -->
  <ellipse cx="360" cy="200" rx="7" ry="34" fill="none" stroke="#d9480f" stroke-width="2"/><ellipse cx="367" cy="200" rx="7" ry="34" fill="none" stroke="#d9480f" stroke-width="2"/><ellipse cx="374" cy="200" rx="7" ry="34" fill="none" stroke="#d9480f" stroke-width="2"/><ellipse cx="381" cy="200" rx="7" ry="34" fill="none" stroke="#d9480f" stroke-width="2"/>
  <rect class="tx" x="405" y="178" width="55" height="44"/><text x="432" y="198" class="s">чип +</text><text x="432" y="212" class="s">нагрузка</text>
  <line class="ltx" x1="388" y1="192" x2="405" y2="192"/><line class="ltx" x1="388" y1="208" x2="405" y2="208"/>
  <text x="432" y="240" class="s" style="fill:#d9480f">L₂</text>
  <!-- M -->
  <line class="l" x1="140" y1="348" x2="350" y2="348" marker-start="url(#mk)" marker-end="url(#mk)"/>
  <text x="245" y="340" class="t i">M (взаимная индуктивность)</text>
  <text x="240" y="374" class="s">ЭДС в метке: u₂ = ω M I₁</text>
  <text x="240" y="392" class="s">Метка меняет нагрузку → считыватель видит изменение</text>
  <text x="240" y="408" class="s">своего импеданса (нагрузочная модуляция)</text>

  <line x1="490" y1="40" x2="490" y2="415" stroke="#ccc"/>

  <text x="725" y="28" font-size="14" font-weight="bold" text-anchor="middle">б) Дальняя зона: излучение</text>
  <text x="725" y="46" class="s">UHF RFID, A-IoT; r много больше λ / 2π</text>
  <!-- reader dipole -->
  <rect class="cwb" x="510" y="170" width="55" height="60"/><text x="537" y="196" class="s">Считы-</text><text x="537" y="210" class="s">ватель</text>
  <line class="lcw" x1="565" y1="200" x2="585" y2="200"/>
  <line x1="585" y1="140" x2="585" y2="260" stroke="#7b2d8b" stroke-width="3"/>
  <!-- wavefronts -->
  <g fill="none" stroke="#7b2d8b" stroke-width="1.6">
    <path d="M615,150 A60,60 0 0 1 615,250"/>
    <path d="M650,130 A90,90 0 0 1 650,270"/>
    <path d="M688,112 A120,120 0 0 1 688,288"/>
  </g>
  <g fill="none" stroke="#d9480f" stroke-width="1.6" stroke-dasharray="6 3">
    <path d="M830,170 A35,35 0 0 0 830,230"/>
    <path d="M808,155 A55,55 0 0 0 808,245"/>
  </g>
  <text x="660" y="104" class="s" style="fill:#7b2d8b">волна от считывателя, мощность ~ 1/r²</text>
  <text x="790" y="290" class="s" style="fill:#d9480f">отражение (backscatter)</text>
  <!-- tag dipole -->
  <line x1="860" y1="160" x2="860" y2="240" stroke="#d9480f" stroke-width="3"/>
  <line class="ltx" x1="860" y1="200" x2="880" y2="200"/>
  <rect class="tx" x="880" y="178" width="60" height="44"/><text x="910" y="198" class="s">чип +</text><text x="910" y="212" class="s">ключ</text>
  <text x="860" y="150" class="s" style="fill:#d9480f">диполь ≈ λ/2</text>
  <!-- E, H -->
  <line class="l" x1="720" y1="340" x2="720" y2="300" marker-end="url(#mk)"/><text x="728" y="306" font-size="12" class="i">E</text>
  <line class="l" x1="720" y1="340" x2="690" y2="360" marker-end="url(#mk)"/><text x="676" y="372" font-size="12" class="i">H</text>
  <line class="l" x1="720" y1="340" x2="770" y2="340" marker-end="url(#mk)"/><text x="776" y="344" font-size="12">направление</text>
  <text x="725" y="384" class="s">E, H и направление взаимно перпендикулярны; E / H ≈ 377 Ом</text>

  <g font-size="12">
    <line class="lcw" x1="150" y1="452" x2="190" y2="452"/><text x="198" y="456" style="fill:#7b2d8b">считыватель (питание, команды)</text>
    <line class="ltx" x1="430" y1="452" x2="470" y2="452"/><text x="478" y="456" style="fill:#d9480f">метка (ответ)</text>
    <line x1="600" y1="452" x2="640" y2="452" stroke="#1f5fae" stroke-width="1.4" stroke-dasharray="5 3"/><text x="648" y="456" style="fill:#1f5fae">силовые линии магнитного поля</text>
  </g>
  <text x="480" y="500" font-size="14" font-weight="bold" text-anchor="middle">Рисунок 2: Механизмы связи считывателя и метки в ближней и дальней зоне</text>
</svg>