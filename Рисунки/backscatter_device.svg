<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="mcw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b2d8b"/></marker>
    <marker id="mrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fae"/></marker>
    <marker id="mtx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
    <marker id="men" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="mlk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07cc0"/></marker>
    <marker id="mdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <style>
      .b{fill:#fff;stroke:#222;stroke-width:1.3}
      .bg{fill:#f4f4f4;stroke:#222;stroke-width:1.3}
      .en{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
      .rx{fill:#e7f0fb;stroke:#1f5fae;stroke-width:1.5}
      .tx{fill:#fff0e6;stroke:#d9480f;stroke-width:1.5}
      .cwb{fill:#f5ebf8;stroke:#7b2d8b;stroke-width:1.5}
      .dev{fill:#f2f2f2;stroke:#2f4a7a;stroke-width:1.6}
      .t{font-size:13px;text-anchor:middle;fill:#111}
      .s{font-size:11.5px;text-anchor:middle;fill:#111}
      .l{stroke:#222;stroke-width:1.3;fill:none}
      .lcw{stroke:#7b2d8b;stroke-width:1.8;fill:none}
      .lrx{stroke:#1f5fae;stroke-width:1.6;fill:none}
      .ltx{stroke:#d9480f;stroke-width:1.8;fill:none}
      .ltxd{stroke:#d9480f;stroke-width:1.8;fill:none;stroke-dasharray:7 4}
      .len{stroke:#2e7d32;stroke-width:1.5;fill:none;stroke-dasharray:5 3}
      .llk{stroke:#b07cc0;stroke-width:1.4;fill:none;stroke-dasharray:3 3}
      .i{font-style:italic}
    </style>
  </defs>

  <rect width="960" height="640" fill="#fff"/>

  <!-- waves -->
  <path class="lcw" marker-end="url(#mcw)" d="M18,52 q8,-8 16,0 t16,0 t16,0 t16,0 t16,0"/>
  <text x="58" y="20" class="s" fill="#7b2d8b" style="fill:#7b2d8b">Падающая волна</text>
  <text x="58" y="34" class="s" style="fill:#7b2d8b">CW / команды R2D</text>
  <path class="ltx" marker-end="url(#mtx)" d="M98,86 q-8,-8 -16,0 t-16,0 t-16,0 t-16,0 t-16,0"/>
  <text x="58" y="110" class="s" style="fill:#d9480f">Отражённая волна</text>
  <text x="58" y="124" class="s" style="fill:#d9480f">D2R</text>

  <!-- antenna -->
  <path class="l" d="M112,40 L140,40 L126,64 z" fill="#fff"/>
  <line class="l" x1="126" y1="64" x2="126" y2="100"/>
  <line class="ltx" x1="126" y1="100" x2="126" y2="414"/>
  <text x="148" y="60" font-size="13" font-style="italic">Z<tspan font-size="9" dy="3">a</tspan></text>

  <!-- top row -->
  <line class="l" x1="126" y1="100" x2="186" y2="100" marker-end="url(#mk)"/>
  <rect class="bg" x="188" y="74" width="120" height="52"/>
  <text x="248" y="96" class="t">Согласующая</text><text x="248" y="113" class="t">цепь</text>
  <line class="len" style="stroke-dasharray:none" x1="308" y1="100" x2="356" y2="100" marker-end="url(#men)"/>
  <rect class="en" x="358" y="74" width="140" height="52"/>
  <text x="428" y="96" class="t">Сборщик энергии</text><text x="428" y="113" class="t">(выпрямитель)</text>
  <line class="len" style="stroke-dasharray:none" x1="498" y1="100" x2="546" y2="100" marker-end="url(#men)"/>
  <rect class="en" x="548" y="64" width="390" height="72" style="fill:#f3faf3"/>
  <rect class="en" x="564" y="80" width="110" height="40"/>
  <text x="619" y="105" class="t">PMU</text>
  <rect class="en" x="690" y="80" width="232" height="40"/>
  <text x="806" y="105" class="t">Накопитель (C, мкФ)</text>

  <!-- device region -->
  <rect class="dev" x="160" y="166" width="778" height="372"/>
  <text x="926" y="528" font-size="13" font-weight="bold" text-anchor="end" fill="#2f4a7a">Device 1</text>
  <line class="len" x1="743" y1="136" x2="743" y2="166" marker-end="url(#men)"/>
  <text x="752" y="157" font-size="11" fill="#2e7d32">питание блоков</text>

  <!-- RX chain -->
  <line class="lrx" x1="248" y1="126" x2="248" y2="196" marker-end="url(#mrx)"/>
  <rect class="rx" x="188" y="198" width="120" height="52"/>
  <text x="248" y="220" class="t">Детектор</text><text x="248" y="237" class="t">огибающей</text>
  <line class="lrx" x1="308" y1="224" x2="356" y2="224" marker-end="url(#mrx)"/>
  <rect class="rx" x="358" y="198" width="110" height="52"/>
  <text x="413" y="229" class="t">ФНЧ</text>
  <line class="lrx" x1="468" y1="224" x2="516" y2="224" marker-end="url(#mrx)"/>
  <rect class="rx" x="518" y="198" width="120" height="52"/>
  <text x="578" y="229" class="t">Компаратор</text>

  <!-- clock -->
  <rect class="b" x="358" y="282" width="150" height="40"/>
  <text x="433" y="307" class="t">Генератор тактов</text>
  <line class="l" x1="508" y1="302" x2="676" y2="302" marker-end="url(#mk)"/>

  <!-- BB logic -->
  <rect class="b" x="678" y="190" width="130" height="236"/>
  <text x="743" y="210" class="t">Логика BB</text>
  <rect class="rx" x="694" y="222" width="98" height="40"/><text x="743" y="247" class="t">декодер</text>
  <rect class="bg" x="694" y="280" width="98" height="40"/><text x="743" y="305" class="t">контроллер</text>
  <rect class="tx" x="694" y="338" width="98" height="40"/><text x="743" y="363" class="t">кодер</text>
  <line class="l" x1="808" y1="300" x2="836" y2="300"/>
  <rect class="bg" x="836" y="190" width="86" height="236"/>
  <text x="879" y="296" class="t">Память</text><text x="879" y="313" class="s">ID, NVM</text>

  <!-- modulator -->
  <polyline class="ltx" points="694,358 660,358 660,414 512,414" marker-end="url(#mtx)"/>
  <text x="590" y="406" class="s" style="fill:#d9480f">данные 0 / 1</text>
  <rect class="tx" x="300" y="386" width="210" height="56"/>
  <text x="405" y="409" class="t">Backscatter-модулятор</text>
  <text x="405" y="427" class="s">(ВЧ-ключ, переключение нагрузки)</text>
  <line class="ltx" x1="300" y1="414" x2="128" y2="414" marker-end="url(#mtx)"/>
  <text x="214" y="406" class="s" style="fill:#d9480f">Γ(t)</text>

  <!-- loads -->
  <line class="ltx" x1="350" y1="442" x2="350" y2="462"/>
  <line class="ltx" x1="460" y1="442" x2="460" y2="462"/>
  <rect class="tx" x="326" y="462" width="48" height="26"/><text x="350" y="480" class="t i">Z₁</text>
  <rect class="tx" x="436" y="462" width="48" height="26"/><text x="460" y="480" class="t i">Z₂</text>
  <g class="l"><line x1="350" y1="488" x2="350" y2="500"/><line x1="338" y1="500" x2="362" y2="500"/><line x1="343" y1="505" x2="357" y2="505"/><line x1="347" y1="510" x2="353" y2="510"/>
  <line x1="460" y1="488" x2="460" y2="500"/><line x1="448" y1="500" x2="472" y2="500"/><line x1="453" y1="505" x2="467" y2="505"/><line x1="457" y1="510" x2="463" y2="510"/></g>
  <text x="350" y="528" class="s">согласована, Γ≈0</text>
  <text x="472" y="528" class="s">КЗ / реактивная, |Γ|≈1</text>

  <polyline class="lrx" points="638,224 662,224 662,242 692,242" marker-end="url(#mrx)"/>

  <!-- legend -->
  <g font-size="12">
    <line class="lcw" x1="60" y1="568" x2="96" y2="568" marker-end="url(#mcw)"/><text x="104" y="572">несущая CW, команды R2D</text>
    <rect class="rx" x="290" y="561" width="22" height="14"/><text x="320" y="572">приём команд (R2D)</text>
    <rect class="tx" x="462" y="561" width="22" height="14"/><text x="492" y="572">передача (D2R, backscatter)</text>
    <rect class="en" x="680" y="561" width="22" height="14"/><text x="710" y="572">энергия и питание</text>
  </g>

  <text x="480" y="614" font-size="14" font-weight="bold" text-anchor="middle">Рисунок 1: Архитектура backscatter-устройства (по TR 38.769, рис. 5.1-1)</text>
</svg>