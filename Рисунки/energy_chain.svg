<text x="664" y="270" class="s" style="fill:#2e7d32">RFID: пФ на кристалле · Device 1: 1–10 мкФ · 2b: десятки–сотни мкФ · C: единицы мФ</text>
<text x="180" y="370" class="s" style="text-anchor:start">У Device 1 используется только радиополе считывателя; у Device 2b и C допустимы любые источники.</text>
<text x="180" y="388" class="s" style="text-anchor:start">PMU включает нагрузку при V ≥ V_high и отключает при V ≤ V_low.</text>
<text x="480" y="420" font-size="14" font-weight="bold" text-anchor="middle">Рисунок 1: Цепочка сбора энергии в A-IoT-устройстве</text>
