<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="mcw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b2d8b"/></marker>
    <marker id="mrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fae"/></marker>
    <marker id="mtx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
    <marker id="men" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="mlk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07cc0"/></marker>
    <marker id="mdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <style>
      .b{fill:#fff;stroke:#222;stroke-width:1.3}
      .bg{fill:#f4f4f4;stroke:#222;stroke-width:1.3}
      .en{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
      .rx{fill:#e7f0fb;stroke:#1f5fae;stroke-width:1.5}
      .tx{fill:#fff0e6;stroke:#d9480f;stroke-width:1.5}
      .cwb{fill:#f5ebf8;stroke:#7b2d8b;stroke-width:1.5}
      .dev{fill:#f2f2f2;stroke:#2f4a7a;stroke-width:1.6}
      .t{font-size:13px;text-anchor:middle;fill:#111}
      .s{font-size:11.5px;text-anchor:middle;fill:#111}
      .l{stroke:#222;stroke-width:1.3;fill:none}
      .lcw{stroke:#7b2d8b;stroke-width:1.8;fill:none}
      .lrx{stroke:#1f5fae;stroke-width:1.6;fill:none}
      .ltx{stroke:#d9480f;stroke-width:1.8;fill:none}
      .ltxd{stroke:#d9480f;stroke-width:1.8;fill:none;stroke-dasharray:7 4}
      .len{stroke:#2e7d32;stroke-width:1.5;fill:none;stroke-dasharray:5 3}
      .llk{stroke:#b07cc0;stroke-width:1.4;fill:none;stroke-dasharray:3 3}
      .i{font-style:italic}
    </style>
  </defs>

  <rect width="960" height="470" fill="#fff"/>

  <text x="240" y="28" font-size="14" font-weight="bold" text-anchor="middle">а) Моностатическая схема (-A2)</text>
  <rect class="b" x="30" y="70" width="170" height="210"/>
  <text x="115" y="92" class="t" font-weight="bold">Считыватель</text>
  <rect class="cwb" x="48" y="108" width="62" height="34"/><text x="79" y="130" class="t">Tx</text>
  <rect class="bg" x="48" y="220" width="62" height="34"/><text x="79" y="242" class="t">Rx</text>
  <circle class="b" cx="160" cy="180" r="22"/>
  <path class="l" d="M150,170 a14,14 0 1 1 0,20" marker-end="url(#mk)"/>
  <text x="172" y="232" class="s">циркулятор</text>
  <polyline class="lcw" points="110,125 160,125 160,157" marker-end="url(#mcw)"/>
  <polyline class="ltx" points="138,180 128,180 128,237 112,237" marker-end="url(#mtx)"/>
  <path class="llk" d="M96,142 L96,218" marker-end="url(#mlk)"/>
  <text x="62" y="186" font-size="11" fill="#9a5fae" text-anchor="middle">утечка</text>
  <text x="62" y="199" font-size="11" fill="#9a5fae" text-anchor="middle">CW</text>
  <line class="l" x1="182" y1="180" x2="226" y2="180"/>
  <line class="l" x1="226" y1="180" x2="226" y2="150"/>
  <path class="l" d="M212,126 L240,126 L226,150 z" fill="#fff"/>
  <rect class="dev" x="370" y="110" width="100" height="120"/>
  <path class="l" d="M406,126 L434,126 L420,150 z" fill="#fff"/>
  <line class="l" x1="420" y1="150" x2="420" y2="170"/>
  <text x="420" y="192" class="t">A-IoT</text><text x="420" y="209" class="t">устройство</text>
  <line class="lcw" x1="250" y1="122" x2="400" y2="122" marker-end="url(#mcw)"/>
  <text x="325" y="104" class="s" style="fill:#7b2d8b">CW + команды R2D</text>
  <line class="ltxd" x1="400" y1="142" x2="250" y2="142" marker-end="url(#mtx)"/>
  <text x="325" y="162" class="s" style="fill:#d9480f">отражение D2R</text>
  <line class="l" x1="226" y1="300" x2="420" y2="300" marker-start="url(#mk)" marker-end="url(#mk)"/>
  <text x="323" y="292" class="t i">r</text>
  <text x="240" y="340" class="s">Мощность отражения падает как 1 / r⁴</text>
  <text x="240" y="358" class="s">CW и отражение на одной антенне → нужна сильная развязка</text>

  <line x1="490" y1="40" x2="490" y2="380" stroke="#ccc" stroke-width="1"/>

  <text x="725" y="28" font-size="14" font-weight="bold" text-anchor="middle">б) Бистатическая схема (-A1, -B)</text>
  <rect class="cwb" x="520" y="70" width="140" height="64"/>
  <text x="590" y="97" class="t" font-weight="bold">Источник CW</text>
  <text x="590" y="115" class="s">(CW node)</text>
  <line class="l" x1="660" y1="102" x2="684" y2="102"/><line class="l" x1="684" y1="102" x2="684" y2="86"/>
  <path class="l" d="M670,62 L698,62 L684,86 z" fill="#fff"/>
  <rect class="bg" x="520" y="250" width="140" height="64"/>
  <text x="590" y="277" class="t" font-weight="bold">Приёмник</text>
  <text x="590" y="295" class="s">(считыватель Rx)</text>
  <line class="l" x1="660" y1="282" x2="684" y2="282"/><line class="l" x1="684" y1="282" x2="684" y2="266"/>
  <path class="l" d="M670,242 L698,242 L684,266 z" fill="#fff"/>
  <rect class="dev" x="830" y="150" width="100" height="120"/>
  <path class="l" d="M866,166 L894,166 L880,190 z" fill="#fff"/>
  <line class="l" x1="880" y1="190" x2="880" y2="210"/>
  <text x="880" y="232" class="t">A-IoT</text><text x="880" y="249" class="t">устройство</text>
  <line class="lcw" x1="704" y1="70" x2="858" y2="160" marker-end="url(#mcw)"/>
  <text x="0" y="0" class="s" style="fill:#7b2d8b" transform="translate(776,104) rotate(30.3)">CW (+ команды R2D)</text>
  <line class="ltxd" x1="858" y1="194" x2="704" y2="246" marker-end="url(#mtx)"/>
  <text x="770" y="266" class="s" style="fill:#d9480f">отражение D2R</text>
  <text class="i" x="752" y="128" font-size="13">d<tspan font-size="9" dy="3">1</tspan></text>
  <text class="i" x="760" y="206" font-size="13">d<tspan font-size="9" dy="3">2</tspan></text>
  <line class="llk" x1="684" y1="138" x2="684" y2="238" marker-end="url(#mlk)"/>
  <text x="640" y="190" font-size="11" fill="#9a5fae" text-anchor="middle">слабая</text>
  <text x="640" y="203" font-size="11" fill="#9a5fae" text-anchor="middle">утечка CW</text>
  <text x="725" y="340" class="s">Мощность отражения падает как 1 / (d₁² · d₂²)</text>
  <text x="725" y="358" class="s">Источник CW разнесён с приёмником → утечка ослабевает с расстоянием</text>

  <g font-size="12">
    <line class="lcw" x1="200" y1="400" x2="250" y2="400" marker-end="url(#mcw)"/><text x="258" y="404" style="fill:#7b2d8b">несущая CW, команды R2D</text>
    <line class="ltxd" x1="470" y1="400" x2="520" y2="400" marker-end="url(#mtx)"/><text x="528" y="404" style="fill:#d9480f">отражённый сигнал D2R</text>
    <line class="llk" x1="710" y1="400" x2="750" y2="400"/><text x="758" y="404" fill="#9a5fae">утечка CW</text>
  </g>

  <text x="480" y="448" font-size="14" font-weight="bold" text-anchor="middle">Рисунок 2: Моностатическая и бистатическая схемы backscatter-линии</text>
</svg>